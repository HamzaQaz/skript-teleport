# ============================================================================
#  Boots a real Paper server with a real Skript and loads this folder into it.
#
#  Skript reports parse errors at load time and nowhere else -- there is no
#  linter that understands its grammar, so a bad clause order or a nested
#  quote sits in a commit looking perfectly fine. The only honest check is to
#  start a server and read the log.
#
#  Fails on any Skript error, and also if the on-load marker this folder
#  prints is missing -- otherwise a run where nothing loaded at all would
#  pass by virtue of a quiet log.
#
#  Everything is resolved from the PaperMC API at run time, including the
#  minimum Java version, so this does not rot when Paper moves.
# ============================================================================

name: Skript load test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCRIPT_DIR: teleport
      EXPECT: '[Teleport] Core loaded'
      MC_VERSION: ''          # blank = newest Paper release
      UA: 'skript-load-ci (github actions)'

    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      # Paper states its own Java floor, so ask rather than guess -- 26.2
      # needs 25, and pinning 21 fails before Skript is even reached.
      - name: Resolve Paper build
        id: paper
        run: |
          set -euo pipefail
          API=https://fill.papermc.io/v3/projects/paper
          V="${MC_VERSION}"
          if [ -z "$V" ]; then
            V=$(curl -sf -A "$UA" "$API" | jq -r '[.versions[][]] | .[0]')
          fi
          URL=$(curl -sf -A "$UA" "$API/versions/$V/builds" \
                | jq -r '[.[] | select(.channel=="STABLE")][0].downloads["server:default"].url // empty')
          if [ -z "$URL" ]; then
            URL=$(curl -sf -A "$UA" "$API/versions/$V/builds/latest" \
                  | jq -r '.downloads["server:default"].url')
          fi
          JAVA=$(curl -sf -A "$UA" "$API/versions/$V" | jq -r '.version.java.version.minimum // 21')
          echo "Paper $V, Java $JAVA"
          echo "version=$V"   >> "$GITHUB_OUTPUT"
          echo "url=$URL"     >> "$GITHUB_OUTPUT"
          echo "java=$JAVA"   >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.paper.outputs.java }}

      - name: Download server and plugins
        run: |
          set -euo pipefail
          mkdir -p server/plugins
          curl -sfL -o server/paper.jar "${{ steps.paper.outputs.url }}"

          SK=$(curl -sf https://api.github.com/repos/SkriptLang/Skript/releases/latest \
               | jq -r '[.assets[] | select(.name | endswith(".jar"))] | .[0].browser_download_url')
          echo "Skript: $SK"
          curl -sfL -o server/plugins/Skript.jar "$SK"

          # Vault alone is not enough: Skript only registers the `balance`
          # expression when an economy PROVIDER has registered with Vault, so
          # without one every money line fails to parse and the run reports
          # errors that do not exist on a real server. EssentialsX is the
          # provider in production, so it is the provider here too.
          VA=$(curl -sf https://api.github.com/repos/MilkBowl/Vault/releases/latest \
               | jq -r '[.assets[] | select(.name | endswith(".jar"))] | .[0].browser_download_url')
          echo "Vault: $VA"
          curl -sfL -o server/plugins/Vault.jar "$VA"

          ES=$(curl -sf https://api.github.com/repos/EssentialsX/Essentials/releases/latest \
               | jq -r '[.assets[] | select(.name | test("^EssentialsX-[0-9]"))] | .[0].browser_download_url')
          echo "EssentialsX: $ES"
          curl -sfL -o server/plugins/EssentialsX.jar "$ES"

      - name: Stage scripts and server config
        run: |
          set -euo pipefail
          DEST="server/plugins/Skript/scripts/$SCRIPT_DIR"
          mkdir -p "$DEST"
          find repo -maxdepth 1 -name '*.sk' -exec cp {} "$DEST/" \;
          N=$(ls -1 "$DEST" | wc -l)
          echo "staged $N script(s)"; ls -1 "$DEST"
          if [ "$N" -eq 0 ]; then echo "::error::no .sk files found"; exit 1; fi
          echo "eula=true" > server/eula.txt
          {
            echo "online-mode=false"
            echo "level-type=minecraft\\:flat"
            echo "generate-structures=false"
            echo "spawn-protection=0"
            echo "view-distance=3"
            echo "simulation-distance=3"
            echo "max-players=1"
            echo "motd=skript-ci"
          } > server/server.properties

      - name: Boot server, wait for load, stop cleanly
        run: |
          set -uo pipefail
          cd server
          mkfifo cmd
          java -Xms1G -Xmx2G -jar paper.jar --nogui < cmd > console.log 2>&1 &
          PID=$!
          exec 3> cmd
          for _ in $(seq 1 300); do
            grep -q 'Done (' console.log && break
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          echo stop >&3 || true
          for _ in $(seq 1 60); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          kill -9 "$PID" 2>/dev/null || true
          exec 3>&- || true
          echo "--- Skript output ---"
          grep -iE '\[Skript\]|\.sk\)|Line [0-9]+:' console.log || true

      - name: Check for Skript errors
        run: |
          set -uo pipefail
          LOG=server/console.log
          FAIL=0
          grep -qE 'Encountered [0-9]+ error' "$LOG" && { echo "::error::Skript reported parse errors"; FAIL=1; }
          grep -qE 'Line [0-9]+: *\('   "$LOG" && { echo "::error::Skript reported a script error"; FAIL=1; }
          if ! grep -qF "$EXPECT" "$LOG"; then
            echo "::error::load marker missing: $EXPECT -- the scripts never ran"
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo; echo "================ errors ================"
            grep -nE -A4 'Line [0-9]+: *\(|Encountered [0-9]+ error' "$LOG" | head -120
            exit 1
          fi
          echo "Skript loaded $SCRIPT_DIR with no errors."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-log
          path: server/console.log
          retention-days: 7
